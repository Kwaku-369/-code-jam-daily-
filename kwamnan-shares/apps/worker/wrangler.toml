name = "kwamnan-shares-api"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://kwamnan-shares.pages.dev"

# KV namespace for rate limiting and sessions
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_YOUR_KV_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "REPLACE_WITH_YOUR_SESSION_KV_ID"
preview_id = "REPLACE_WITH_YOUR_SESSION_KV_PREVIEW_ID"

# Secrets (set via: wrangler secret put VARIABLE_NAME)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# PAYSTACK_SECRET_KEY
# JWT_SECRET
# WEBHOOK_SECRET

[build]
command = "npm run build"

[env.development]
vars = { ENVIRONMENT = "development", FRONTEND_URL = "http://localhost:3000" }
